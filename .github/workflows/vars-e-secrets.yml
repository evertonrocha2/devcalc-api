name: Demonstração de Variáveis e Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vars-e-secrets.yml'

jobs:
  usar-variaveis:
    name: Uso de Variáveis e Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Exibir variáveis não sensíveis
        run: |
          echo "APP_MODE: ${{ vars.APP_MODE }}"
          echo "SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Runner OS: ${{ runner.os }}"
      
      - name: Usar variável para configurar aplicação
        env:
          MODE: ${{ vars.APP_MODE }}
          EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          echo "Modo: $MODE"
          echo "Email: $EMAIL"
          if [ "$MODE" = "production" ]; then
            echo "Ambiente: PRODUCAO"
          else
            echo "Ambiente: DESENVOLVIMENTO"
          fi
      
      - name: Simular autenticação com secret
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ -z "$PROD_TOKEN" ]; then
            echo "Token nao configurado"
            exit 1
          fi
          echo "Token presente: ${PROD_TOKEN:0:4}****"
          echo "Tamanho: ${#PROD_TOKEN} caracteres"
          echo "Autenticacao bem-sucedida"
      
      - name: Usar secret em tarefa sensível
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://api.evertonrocha.dev' }}
        run: |
          echo "API URL: $API_URL"
          echo "Requisicao autenticada simulada"
          echo "Deploy executado com sucesso"
      
      - name: Resumo de configuração
        run: |
          echo "## Configuração do Ambiente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo:** ${{ vars.APP_MODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Email:** ${{ vars.SUPPORT_EMAIL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Token:** Configurado" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
