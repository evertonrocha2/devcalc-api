name: Maven CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build com Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build com Maven
        run: mvn clean package -B
