name: Hello CI/CD

on:
  push:

jobs:
  hello:
    name: Hello Job
    runs-on: ubuntu-latest

    steps:
      - name: Exibir Hello CI/CD
        run: echo "Hello CI/CD"

      - name: Mostrar informacoes do evento
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Acionado por: ${{ github.actor }}"
