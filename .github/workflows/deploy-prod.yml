name: Deploy para Produção

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ENVIRONMENT: production

jobs:
  deploy-prod:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://api.devcalc.evertonrocha.dev
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      
      - name: Build da aplicação
        run: mvn clean package -DskipTests
      
      - name: Executar testes completos
        run: mvn test verify
      
      - name: Verificar qualidade do código
        run: mvn checkstyle:checkstyle
        continue-on-error: true
      
      - name: Usar secrets do ambiente Prod
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          APP_MODE: ${{ vars.APP_MODE }}
        run: |
          echo "Modo: $APP_MODE"
          echo "Token: ${PROD_TOKEN:0:4}****"
          echo "API Key: Configurada"
          echo "Ambiente: $ENVIRONMENT"
      
      - name: Aguardar aprovação manual
        run: |
          echo "Aguardando aprovacao manual"
          echo "Deploy requer aprovacao de revisor"
      
      - name: Deploy para produção
        run: |
          echo "Versao: 1.0.0"
          echo "Artefato: devcalc-api.jar"
          echo "Destino: Servidores de Producao"
          echo "Executando health checks..."
          echo "API: OK"
          echo "Banco de dados: OK"
          echo "Cache: OK"
          echo "Deploy concluido com sucesso"
          echo "URL: https://api.devcalc.evertonrocha.dev"
      
      - name: Criar tag de release
        run: |
          echo "Versao: v1.0.0-${{ github.run_number }}"
          echo "Tag de release criada"
      
      - name: Notificar equipe
        run: echo "Equipe notificada sobre deploy"
      
      - name: Resumo do deploy
        run: |
          echo "## Deploy PRODUCAO Concluido" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://api.devcalc.evertonrocha.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Aprovado por:** Revisor" >> $GITHUB_STEP_SUMMARY
